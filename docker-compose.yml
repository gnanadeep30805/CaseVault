version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: casevault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: casevault
      POSTGRES_USER: casevault
      POSTGRES_PASSWORD: casevault
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: casevault-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: casevault-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    container_name: casevault-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: casevault-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app

volumes:
  postgres_data:
  redis_data:
  minio_data:
